<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 3: Seattle Park Accessibility</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">
  <style>
    body { margin: 0; font: 14px/1.5 Arial, sans-serif; color: #182e3a; }
    #map { position: absolute; inset: 0; }
    #panel { position: absolute; top: 12px; left: 12px; padding: 16px;
      width: 260px; max-width: calc(100% - 100px); background: white;
      max-height: calc(100% - 80px); overflow: auto; border-radius: 6px; }
    h1 { margin: 0 0 8px; font-size: 19px; }
    p { margin: 8px 0; }
    .ramp { height: 14px; background: linear-gradient(to right,
      #fafafa, #bdbdbd, #808080, #424242, #050505); }
    .values { display: flex; justify-content: space-between; }
    .maplibregl-popup-content { white-space: pre-line; }
  </style>
</head>
<body>
  <div id="map"></div>
  <section id="panel">
    <h1>Seattle Park Accessibility</h1>
    <p>Seattle Parks & Recreation | Size Distribution</p>
    <p id="status">Step 1: map frame ready; add the basemap next.</p>
    <div id="surface-control" hidden>
      <label><input id="show-surface" type="checkbox" checked> Show interpolation</label>
    </div>
    <div id="station-control" hidden>
      <label><input id="show-stations" type="checkbox" checked> Show parks</label>
    </div>
    <div id="legend" hidden>
      <p><strong>Park Area (Acres)</strong></p>
      <div class="ramp"></div>
      <div class="values"><span>0</span><span>200</span><span>400+</span></div>
      <p>IDW surface of park distribution.</p>
    </div>
  </section>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {},
        layers: [{ id: 'background', type: 'background',
          paint: { 'background-color': '#edf1f0' } }]
      },
      center: [-122.3321, 47.6062],
      zoom: 10,
      minZoom: 8,
      maxZoom: 12,
      maxBounds: [[-122.75, 47.10], [-122.05, 48.15]]
    });
    map.addControl(new maplibregl.NavigationControl());
    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

    map.on('error', (event) => {
      document.getElementById('status').textContent =
        'Load error: check the file path and browser Console.';
      console.error(event.error);
    });

    map.on('load', () => {
      // Step 2: insert the basemap tile code here.
      map.addSource('basemap-tiles', {
        type: 'raster',
        tiles: ['assets/mapbox_independent/{z}/{x}/{y}.png'],
        tileSize: 256,
        scheme: 'xyz',
        minzoom: 8,
        maxzoom: 12,
        bounds: [-122.75, 47.10, -122.05, 48.15],
        attribution: '© Mapbox © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      });
      map.addLayer({
        id: 'basemap',
        type: 'raster',
        source: 'basemap-tiles',
        paint: { 'raster-opacity': 1, 'raster-fade-duration': 0 }
      });

      document.getElementById('status').textContent =
        'Step 2: check your Studio basemap; pan and zoom.';

      // Step 3: insert the interpolation tile code here.
      map.addSource('independent-raster-tiles', {
        type: 'raster',
        tiles: ['assets/park-accessibility/{z}/{x}/{y}.png'],
        tileSize: 256,
        scheme: 'xyz',
        minzoom: 8,
        maxzoom: 12,
        bounds: [-122.75, 47.10, -122.05, 48.15],
        attribution: 'Map by Andrew Tran'
      });
      map.addLayer({
        id: 'park-accessibility',
        type: 'raster',
        source: 'independent-raster-tiles',
        paint: { 'raster-opacity': 0.7, 'raster-fade-duration': 0 }
      });

      document.getElementById('surface-control').hidden = false;
      document.getElementById('legend').hidden = false;
      document.getElementById('show-surface').addEventListener('change', (event) => {
        map.setLayoutProperty('park-accessibility', 'visibility',
          event.target.checked ? 'visible' : 'none');
        document.getElementById('legend').hidden = !event.target.checked;
      });
      document.getElementById('status').textContent =
        'Step 3: toggle the interpolation to compare it with the basemap.';

      // Step 4: insert the station and popup code here.
      map.addSource('park-data', {
        type: 'geojson',
        data: 'data/park_centroids.geojson'
      });
      map.addLayer({
        id: 'parks',
        type: 'circle',
        source: 'park-data',
        paint: {
          'circle-radius': [
            'interpolate', ['linear'],
            ['to-number', ['get', 'area_acres'], 0],
            1, 3,
            25, 6,
            100, 12
          ],
          'circle-color': '#18364d',
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 2
        }
      });

      map.on('click', 'parks', (event) => {
        const feature = event.features[0];
        const props = feature.properties;
        new maplibregl.Popup()
          .setLngLat(feature.geometry.coordinates)
          .setText([
            props['NAME'],
            'Area: ' + Number(props['area_acres']).toFixed(2) + ' acres',
            'Management Area: ' + props['PMA']
          ].join('\n'))
          .addTo(map);
      });
      map.on('mouseenter', 'parks', () => {
        map.getCanvas().style.cursor = 'pointer';
      });
      map.on('mouseleave', 'parks', () => {
        map.getCanvas().style.cursor = '';
      });
      document.getElementById('station-control').hidden = false;
      document.getElementById('show-stations').addEventListener('change', (event) => {
        map.setLayoutProperty('parks', 'visibility',
          event.target.checked ? 'visible' : 'none');
      });
      document.getElementById('status').textContent =
        'Step 4: click a park to read its attributes.';
    });
  </script>
</body>
</html>
